<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="./Layouts.css"
<title>Display Property</title>
<h1>display:Block</h1>

</head>
<style>
div {
    display: block;
    background-color: lightblue;
    border: 2px solid blue;
    margin: 10px;
}
</style>
<body>


    <div>Block 1</div>
<div>Block 2</div>

<h2>Display:inline</h2>
<style>
span {
    display: inline;
    background-color: yellow;
}
</style>

<span>Hello</span>
<span>World</span>


<h3>display inline-block</h3>
<style>
.box {
    display: inline-block;
    width: 100px;
    height: 80px;
    background: lightgreen;
    margin: 5px;
    text-align: center;
    line-height: 80px;
}
</style>

<div class="box">welcome</div>
<div class="box">to</div>
<div class="box">the world</div>

<h4>display none</h4>

<style>
.hide {
    display: none;
}
</style>

<p>This is visible.</p>
<p class="hide">This is hidden.</p>


</body>
</html>
