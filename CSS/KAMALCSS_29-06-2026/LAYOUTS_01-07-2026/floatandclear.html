<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./Layouts.css"

</head>
<style>
* {
    box-sizing: border-box;
}

.header {
    background: steelblue;
    color: white;
    padding: 20px;
    text-align: center;
}

.sidebar {
    float: left;
    width: 30%;
    background: lightgray;
    height: 250px;
    padding: 15px;
}

.content {
    float: left;
    width: 70%;
    background: lightyellow;
    height: 250px;
    padding: 15px;
}

.footer {
    clear: both;
    background: steelblue;
    color: white;
    text-align: center;
    padding: 15px;
}
</style>

<body>

    <div class="header">
    <h2>Website Header</h2>
</div>

<div class="sidebar">
    <h3>Sidebar</h3>
    <p>Menu items</p>
</div>

<div class="content">
    <h3>Main Content</h3>
    <p>This is the main content area.</p>
</div>

<div class="footer">
    <p>Website Footer</p>
</div>

////
<style>
.column {
    float: left;
    width: 33.33%;
    padding: 20px;
    height: 200px;
    box-sizing: border-box;
}

.col1 {
    background: lightcoral;
}

.col2 {
    background: lightgreen;
}

.col3 {
    background: lightblue;
}

.footer {
    clear: both;
    background: black;
    color: white;
    text-align: center;
    padding: 15px;
}
</style>
<div class="column col1">
    <h3>Column 1</h3>
</div>

<div class="column col2">
    <h3>Column 2</h3>
</div>

<div class="column col3">
    <h3>Column 3</h3>
</div>

<div class="footer">
    Footer
</div>

    
</body>
</html>
