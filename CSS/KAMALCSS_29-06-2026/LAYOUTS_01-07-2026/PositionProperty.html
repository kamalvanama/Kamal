<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./Layouts.css"
   
    <title>Position Property</title>
</head>

<h1>position: static</h1>
<style>
.box {
    position: static;
    background: lightblue;
    padding: 20px;
    border: 2px solid blue;
}
</style>

<body>
    <div class="box">Static Position</div>

<h2>position: relative</h2>
<style>
.box {
    position: relative;
    left: 50px;
    top: 20px;
    background: lightgreen;
    padding: 20px;
}
</style>

<div class="box">Relative Position</div>

</div>

<h3>position: absolute</h3>
<style>
.container {
    position: relative;
    width: 300px;
    height: 200px;
    border: 2px solid black;
}

.box {
    position: absolute;
    top: 20px;
    right: 20px;
    background: orange;
    padding: 10px;
}
</style>

<div class="container">
    <div class="box">Absolute Position</div>

    <h4>position: fixed</h4>
    <style>
.box {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: red;
    color: white;
    padding: 15px;
}
</style>

<div class="box">Fixed Button</div>

<p>Scroll the page to see the button stay in place.</p>

<h5>psition: sticky</h5>

<style>
.header {
    position: sticky;
    top: 0;
    background: blue;
    color: white;
    padding: 15px;
}
</style>

<div class="header">Sticky Header</div>

<p>Scroll the page to see the header stick to the top.</p>

</body>
</html>
